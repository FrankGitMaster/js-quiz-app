<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./quiz.js"></script>
    <title>JS Quiz App</title>
</head>

<body>
    <div class="principal d-flex flex-column justify-content-center align-items-center">
        <button type="button" id="star-game-btn" class="btn btn-lg"></button>
        <template id="card-template">
            <div class="card col-12 col-sm-6 col-md-4 d-flex">
                <div class="card-header text-center">
                    <div id="question-id"></div>
                    <div class="timer d-flex align-items-center justify-content-center">
                        <img src="./crono.png">
                        <span id="remaining-time"></span>
                    </div>
                    <div id="question"></div>
                </div>
                <div class="card-body d-flex flex-column"></div>
                <div class="card-footer d-flex justify-content-center">
                    <button type="button" id="action-btn" class="btn" disabled></button>
                </div>
            </div>
        </template>
        <template id="total-score-template">
            <div class="card col-12 col-sm-6 col-md-4 d-flex">
                <h2 id="finish-title"></h2>
                <span id="finish-message"></span>
            </div>
        </template>
    </div>
</body>

</html>
